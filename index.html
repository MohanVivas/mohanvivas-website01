<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Vivas website - currently under load.">
  <title>Under Load | Vivas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at top left, #7c3aed 0, transparent 35%),
        radial-gradient(circle at bottom right, #e11d48 0, transparent 35%),
        #08080d;
      overflow: hidden;
    }
    .card {
      width: min(90%, 520px);
      padding: 55px 30px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 28px;
      background: rgba(255,255,255,.08);
      backdrop-filter: blur(18px);
      box-shadow: 0 25px 80px rgba(0,0,0,.45);
    }
    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 25px;
      display: grid;
      place-items: center;
      border-radius: 22px;
      background: linear-gradient(135deg, #fff, #c4b5fd);
      color: #111;
      font-size: 30px;
      font-weight: 800;
    }
    h1 { font-size: clamp(36px, 10vw, 58px); letter-spacing: -2px; }
    .vivas {
      margin-top: 8px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 5px;
      text-transform: uppercase;
      opacity: .75;
    }
    p {
      margin: 25px auto;
      max-width: 380px;
      line-height: 1.7;
      color: rgba(255,255,255,.72);
    }
    .loader {
      width: 52px;
      height: 52px;
      margin: 30px auto 0;
      border: 4px solid rgba(255,255,255,.18);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .footer {
      margin-top: 35px;
      font-size: 13px;
      color: rgba(255,255,255,.45);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">V</div>
    <h1>Under Load</h1>
    <div class="vivas">by Vivas</div>
    <p>
      Something awesome is being prepared.
      The website is currently under development.
      Please check back soon.
    </p>
    <div class="loader" aria-label="Loading"></div>
    <div class="footer">mohanvivas.com</div>
  </main>
</body>
</html>
