
<section id="laddu-countdown" style="background:#fff0f6;color:#9d174d;text-align:center;padding:30px 12px;border-radius:20px;font-family:Arial,sans-serif;margin:20px auto;max-width:600px;">
  <div style="font-size:45px">🎂💗✨</div>
  <h2>Advance Happy Birthday, My Laddu! 🎀</h2>
  <p>Your special moment is getting closer! 🥹💖</p>
  <div id="laddu-clock" style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap"></div>
  <p>Made with love, just for you 💋🧿</p>
</section>

<script>
(function () {
  const target = new Date("2026-10-31T00:00:00+05:30").getTime();
  const clock = document.getElementById("laddu-clock");

  function tick() {
    const diff = Math.max(0, target - Date.now());
    const values = [
      ["Days", Math.floor(diff / 86400000)],
      ["Hours", Math.floor(diff / 3600000) % 24],
      ["Minutes", Math.floor(diff / 60000) % 60],
      ["Seconds", Math.floor(diff / 1000) % 60]
    ];

    clock.innerHTML = values.map(([label, value]) =>
      `<div style="background:white;padding:12px 8px;border-radius:12px;min-width:65px">
        <div style="font-size:27px;font-weight:bold">${String(value).padStart(2,"0")}</div>
        <small>${label}</small>
      </div>`
    ).join("");

    if (diff === 0) {
      clock.innerHTML = "<h2>Happy Birthday, My Laddu! 🥳🎂💖</h2>";
    }
  }

  tick();
  setInterval(tick, 1000);
})();
</script>
